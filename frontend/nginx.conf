server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service (named "backend" in
    # docker-compose.yml). Large batch CSV uploads need a bumped body size.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 20m;
        proxy_read_timeout 120s;
    }

    # Single-page app: any non-file route falls back to index.html so
    # client-side routing (react-router) works on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
