# Render Blueprint: deploys the same three services docker-compose.yml runs
# locally (Postgres, backend API, frontend), wired together with Render's
# own service discovery instead of Docker Compose's private network.
#
# Deploy: push this file to the repo, then on render.com choose
# New -> Blueprint and point it at this repo. Render reads this file and
# provisions everything below in one step. See README.md's "Deploying to
# Render" section for the full walkthrough and what differs from local
# Docker Compose and why -- the comments below cover the per-service detail.

databases:
  # Render's managed Postgres. Free for 90 days, after which it must be
  # upgraded to a paid plan or recreated -- acceptable for a demo/portfolio
  # deployment; noted in README.md's deploy section.
  - name: manas-db
    plan: free
    databaseName: manas
    user: manas

services:
  # --- Backend: FastAPI + the ML inference pipeline -------------------
  - type: web
    name: manas-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      # Render hands out a bare postgresql:// URL; app/config.py's
      # _ensure_psycopg_driver validator rewrites it to postgresql+psycopg://
      # (the driver actually pinned in requirements.txt) automatically.
      - key: DATABASE_URL
        fromDatabase:
          name: manas-db
          property: connectionString
      # Render-generated random secret -- never the insecure
      # "dev-secret-change-me-in-production" default in config.py.
      - key: JWT_SECRET
        generateValue: true
      # Must include the frontend's real PUBLIC Render URL so the browser's
      # CORS preflight succeeds (frontend and backend are different origins
      # here, unlike local docker-compose where nginx makes them look like
      # one). This is hardcoded to the standard <service-name>.onrender.com
      # pattern rather than templated via fromService/property:host: that
      # property returns the service's *private-network* hostname (e.g.
      # "manas-frontend-0ln7", a random per-deploy suffix, HTTP-only,
      # resolvable only inside Render's network) -- never the public HTTPS
      # URL a browser actually connects to. There is no fromService property
      # that returns the public URL (confirmed against Render's Blueprint
      # spec), so the deterministic onrender.com pattern is the reliable
      # option for a free-tier service with no custom domain attached. If
      # you rename manas-frontend or attach a custom domain, update this.
      - key: CORS_ORIGINS
        value: https://manas-frontend.onrender.com

  # --- Frontend: React build served by nginx, proxying /api/ ----------
  - type: web
    name: manas-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      # Consumed by frontend/docker-entrypoint.sh (envsubst into
      # nginx.conf.template) so nginx proxies /api/ to the real deployed
      # backend instead of docker-compose's "backend" service-name default.
      #
      # Uses the backend's PUBLIC URL (manas-backend.onrender.com over
      # HTTPS/443) rather than Render's private network. Two earlier
      # versions of this file tried the private network and failed for two
      # separate reasons, in order: (1) fromService/property:host returns
      # the private-network hostname (e.g. "manas-backend-0ln7"), which was
      # wrongly paired with an https/443 scheme -- that hostname isn't a
      # TLS endpoint, giving nginx's "host not found in upstream" boot
      # failure; (2) even fixed to plain HTTP, Render's free plan blocks
      # free web services from *receiving* private-network requests at all
      # (they can only send them) -- manas-backend being free means nothing,
      # not even manas-frontend, could ever reach it that way. The public
      # URL has no such restriction on any plan, at the cost of that traffic
      # making a public-internet hop instead of staying inside Render.
      - key: BACKEND_SCHEME
        value: https
      - key: BACKEND_HOST
        value: manas-backend.onrender.com
      - key: BACKEND_PORT
        value: "443"
